canonical_models:
  deepseek-chat:
    - deepseek-chat
    - deepseek-v3
    - deepseek/deepseek-chat

  deepseek-reasoner:
    - deepseek-reasoner
    - deepseek-r1
    - deepseek/deepseek-reasoner

  gpt-4o:
    - gpt-4o
    - openai/gpt-4o
    - chatgpt-4o-latest

  gpt-4o-mini:
    - gpt-4o-mini
    - openai/gpt-4o-mini

  gpt-4.1:
    - gpt-4.1
    - openai/gpt-4.1

  gpt-4.1-mini:
    - gpt-4.1-mini
    - openai/gpt-4.1-mini

  claude-sonnet-4:
    - claude-sonnet-4
    - claude-4-sonnet
    - anthropic/claude-sonnet-4

  claude-3.5-haiku:
    - claude-3.5-haiku
    - claude-3-5-haiku
    - anthropic/claude-3.5-haiku

model_include:
  - deepseek-*
  - gpt-*
  - claude-*
  - doubao-*
  - glm-*

model_exclude:
  - "*embedding*"
  - "*moderation*"
  - "*audio*"
  - "*image*"
  - "*tts*"
  - "*whisper*"

probe:
  chat:
    enabled: true
    path: /chat/completions
    body:
      messages:
        - role: user
          content: ping
      max_tokens: 8
      temperature: 0
      stream: false

  responses:
    enabled: true
    path: /responses
    body:
      input: ping
      max_output_tokens: 8
      temperature: 0
      stream: false
